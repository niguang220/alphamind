# Prometheus 配置文件 — AlphaMind 证券投研助手

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'alphamind'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # AlphaMind 主应用指标
  - job_name: 'alphamind-app'
    static_configs:
      - targets: ['alphamind:8000']
        labels:
          service: 'alphamind'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

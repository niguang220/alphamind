# Prometheus configuration — AlphaMind Securities Research Assistant

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'alphamind'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # AlphaMind application metrics
  - job_name: 'alphamind-app'
    static_configs:
      - targets: ['alphamind:8000']
        labels:
          service: 'alphamind'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# AlphaMind Securities Research Assistant — Docker Compose services
# Three-tier memory: Redis (working memory) + ChromaDB (episodic memory + user profile)

services:

  # ── Redis cache (working memory) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alphamind-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-alphamind123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - alphamind-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alphamind123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB vector store (episodic memory + user profile) ───────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: alphamind-chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - alphamind-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus monitoring ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: alphamind-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - alphamind-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── AlphaMind application ────────────────────────────────────────────────────
  alphamind:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: alphamind-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Fixed in-container values, overriding the local paths in .env
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alphamind123}@redis:6379/0
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - ALPHAMIND_SKILLS_DIR=/app/skills
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/eval:/app/data/eval
      - ./skills:/app/skills
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alphamind-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: alphamind-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      alphamind:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alphamind-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  alphamind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
